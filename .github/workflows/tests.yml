name: tests
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        os: [ubuntu-26.04]
        include:
          - python-version: '3.9'  # no Ubuntu 26.04 build of it
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y samtools
      - run: python -m pip install -e '.[test]'
      - run: ruff check osteosarc tests scripts
      - run: python -m pytest -q
      - run: python -m build

  consumers:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        varcode-version: ['7.0.0', '9.3.7']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y samtools
      - run: python -m pip install -e '.[test]' varcode==${{ matrix.varcode-version }} isovar==1.17.0 topiary==5.55.1
      - run: python -c 'import varcode, isovar, topiary'
      - run: python -m pytest tests/test_consumer_usage.py -q
