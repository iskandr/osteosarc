name: tests
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y samtools
      - run: python -m pip install -e '.[test]'
      - run: ruff check osteosarc tests scripts
      - run: python -m pytest -q
      - run: python -m build

  consumers:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        include:
          - label: legacy-varcode-7
            packages: typechecks varcode==7.0.0 isovar==1.17.0 topiary==5.55.1
          - label: legacy-varcode-9
            packages: typechecks varcode==9.3.7 isovar==1.17.0 topiary==5.55.1
          - label: current
            packages: "'varcode>=10.21.1' isovar topiary"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y samtools
      - run: python -m pip install -e '.[test]' ${{ matrix.packages }}
      - run: python -c 'import varcode, isovar, topiary'
      - run: python -m pytest tests/test_consumer_usage.py -q
