name: tests
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y samtools
      - run: python -m pip install -e '.[test]'
      - run: ruff check osteosarc tests scripts
      - run: python -m pytest -q
      - run: python -m build

  consumers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y samtools
      - run: python -m pip install -e '.[test]' varcode==7.0.0 isovar==1.17.0 topiary==5.55.1
      - run: python -c 'import varcode, isovar, topiary'
      - run: python -m pytest tests/test_consumer_usage.py -q
