name: drift
# Weekly check that the live osteosarc.com sources still match the curation
# (osteosarc/curation.py) and that every documented example still runs.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  corrections:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: osteosarc --cache "$RUNNER_TEMP/cache" sync "drift-${{ github.run_id }}"
      - run: osteosarc --cache "$RUNNER_TEMP/cache" curation "drift-${{ github.run_id }}" --strict

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y samtools
      - run: python -m pip install -e '.[test,docs]' pandas varcode==7.0.0 isovar==1.17.0 topiary==5.55.1
      - run: pyensembl install --release 95 --species homo_sapiens
      - run: python scripts/check_docs.py
