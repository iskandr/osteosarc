site_name: Osteosarc
site_description: Python library and CLI for the osteosarc.com dataset. Find files, select variants and vaccine peptides, and fetch sequencing reads.
site_url: https://iskandr.github.io/osteosarc/
repo_url: https://github.com/iskandr/osteosarc
edit_uri: edit/main/docs/
theme:
  name: mkdocs
  color_mode: light
  user_color_mode_toggle: true
  nav_style: light
  highlightjs: true
  hljs_languages: [python, bash]
nav:
  - Home: index.md
  - Key concepts: concepts.md
  - Guides:
      - Samples and files: samples.md
      - Select variants and peptides: variants.md
      - Extract reads: reads.md
      - Browse the timeline: timeline.md
      - Command line: cli.md
      - Use other libraries: consumers.md
      - Replace download helpers: migration.md
      - "Worked example: MAP2": tour.md
  - Fixtures and SVs:
      - Read fixtures and bundles: fixtures.md
      - SV interest catalogue: sv-interest.md
      - OpenVax fixture adoption: fixture-migration.md
  - Reference:
      - Python API: api.md
      - Snapshots and cache: design.md
      - Source corrections: curation.md
      - Testing and data checks: validation.md
      - Changelog: changelog.md
validation:
  anchors: warn
markdown_extensions:
  - admonition
  - tables
  - fenced_code
  - toc:
      permalink: true
