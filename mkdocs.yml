site_name: Osteosarc
site_description: Find files, select variants, and fetch sequencing reads from osteosarc.com.
site_url: https://iskandr.github.io/osteosarc/
repo_url: https://github.com/iskandr/osteosarc
edit_uri: edit/main/docs/
theme:
  name: mkdocs
  color_mode: light
  user_color_mode_toggle: true
  nav_style: light
  highlightjs: true
  hljs_languages: [python, bash]
nav:
  - Get started: index.md
  - Examples:
      - Find files and tables: explore.md
      - Select variants and peptides: variants.md
      - Extract reads: reads.md
      - Browse the timeline: timeline.md
      - Use other libraries: consumers.md
      - Check MAP2 against reads: tour.md
  - Reference:
      - API: api.md
      - Snapshots and cache: design.md
      - Source corrections: curation.md
  - Development:
      - Migrate existing code: migration.md
      - Testing: validation.md
markdown_extensions:
  - admonition
  - tables
  - fenced_code
  - toc:
      permalink: true
