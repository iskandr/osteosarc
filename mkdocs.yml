site_name: Osteosarc
site_description: Python library and CLI for the osteosarc.com dataset. Find files, select variants and vaccine peptides, and fetch sequencing reads.
site_url: https://iskandr.github.io/osteosarc/
repo_url: https://github.com/iskandr/osteosarc
edit_uri: edit/main/docs/
theme:
  name: mkdocs
  color_mode: light
  user_color_mode_toggle: true
  nav_style: light
  highlightjs: true
  hljs_languages: [python, bash]
nav:
  - Home: index.md
  - Concepts: concepts.md
  - Guides:
      - Samples and files: samples.md
      - Variants and vaccines: variants.md
      - Reads: reads.md
      - Timeline: timeline.md
      - SV candidates: sv-candidates.md
      - Command line: command-line.md
      - "Example: MAP2": map2.md
  - OpenVax:
      - OpenVax libraries: openvax.md
      - Test data: test-data.md
  - Reference:
      - Python API: python-api.md
      - Snapshots and cache: snapshots.md
      - Corrections: corrections.md
      - Testing: testing.md
      - Changelog: changelog.md
validation:
  anchors: warn
markdown_extensions:
  - admonition
  - tables
  - fenced_code
  - toc:
      permalink: true
