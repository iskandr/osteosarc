[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "osteosarc"
version = "0.11.0"
description = "Reproducible access to the public osteosarc.com dataset"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Alex Rubinsteyn", email = "alex.rubinsteyn@gmail.com" }]
keywords = ["osteosarcoma", "genomics", "neoantigen", "bioinformatics", "openvax"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["beautifulsoup4>=4.12", "datacache>=1.9.1", "pysam>=0.22", "requests>=2.28"]

[project.urls]
Documentation = "https://iskandr.github.io/osteosarc/"
Source = "https://github.com/iskandr/osteosarc"
Issues = "https://github.com/iskandr/osteosarc/issues"
Dataset = "https://osteosarc.com/data/"

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.9", "build>=1"]
docs = ["mkdocs>=1.6,<2"]

[project.scripts]
osteosarc = "osteosarc.cli:main"

[tool.setuptools.packages.find]
include = ["osteosarc*"]

[tool.setuptools.package-data]
osteosarc = ["data/*.json", "data/bundles/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# The fixture excerpt lacks most corrected records; curation tests assert warnings explicitly.
filterwarnings = ["ignore::osteosarc.curation.CurationWarning"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
