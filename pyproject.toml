[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "osteosarc"
version = "0.1.0"
description = "Reproducible access to the public osteosarc.com dataset"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["beautifulsoup4>=4.12"]

[project.optional-dependencies]
reads = ["pysam>=0.22"]
test = ["pytest>=8", "pysam>=0.22", "ruff>=0.9", "build>=1"]
docs = ["mkdocs>=1.6,<2"]

[project.scripts]
osteosarc = "osteosarc.cli:main"

[tool.setuptools.packages.find]
include = ["osteosarc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# The fixture excerpt lacks most corrected records; curation tests assert warnings explicitly.
filterwarnings = ["ignore::osteosarc.curation.CurationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
